 if(destinations.length===1){const other=unique(portList.filter(p=>p!==from&&!destinations.includes(p)));add({company:c,prompt:`${c}の「${from}」発。公開されている行先は？`,answer:to,wrong:randWrong(other,to),explain:`${c}：${from} → ${to}。${note}`,source:key,ports:[from,to],type:'destination'});}
 });
 // A factual geography question for each publicly sourced terminal.
 for(const port of portList){const c=PORTS[port];if(!c)continue;const area=c[1]>=40?'北海道・東北':c[1]>=35?'関東・中部・北陸':c[1]>=33?'関西・中国・四国・北九州':'南九州';const rr=ROUTES.find(r=>r[1]===port||r[2]===port);add({company:rr[0],prompt:`「${port}」の位置は日本のどのエリア？`,answer:area,wrong:['北海道・東北','関東・中部・北陸','関西・中国・四国・北九州','南九州'].filter(a=>a!==area),explain:`${port}の位置を地図で確認しよう。`,source:rr[3],ports:[port],type:'geography'});}
 return out.filter(q=>q.wrong.length>=3).map(q=>({...q,choices:shuffle([q.answer,...q.wrong.slice(0,3)])}));}
const QUESTIONS=buildQuestions();
const STORAGE_KEY='route-master-public-v1';let saved={attempts:[],wrong:[]};try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(v&&Array.isArray(v.attempts)&&Array.isArray(v.wrong))saved=v}catch(e){};
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(saved))}catch(e){}}
const state={tab:'home',quizCompany:'all',quizCount:'10',quizType:'all',quizItems:[],qIndex:0,selected:null,runCorrect:0,selectedPort:'釧路',mapCompany:'all',routeCompany:'all',search:''};
const main=$('main');
function updateTabs(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab||state.tab==='setup'&&b.dataset.tab==='quiz');b.setAttribute('aria-current',b.classList.contains('active')?'page':'false')});}
function render(){updateTabs();$('stat-questions').textContent=QUESTIONS.length;$('stat-companies').textContent=companyList.length;$('stat-ports').textContent=portList.length;
 if(state.tab==='home')return home();if(state.tab==='setup')return setup();if(state.tab==='quiz')return quiz();if(state.tab==='map')return map();if(state.tab==='routes')return routes();}
function go(tab){state.tab=tab;if(tab==='quiz'&&!state.quizItems.length)state.tab='setup';render();window.scrollTo(0,0);}
const option=(value,text,current)=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(text)}</option>`;
function home(){main.innerHTML=`<h2>どこから始める？</h2><button class="panel clickable" data-action="setup"><div><h3>🧠 4択クイズ</h3><p class="muted">${QUESTIONS.length}問から出題。会社別の特訓や復習も。</p></div><span class="chev">›</span></button><button class="panel clickable" data-action="map"><div><h3>🗾 日本地図モード</h3><p class="muted">港の位置をタップして、発着地と船会社を確認。</p></div><span class="chev">›</span></button><button class="panel clickable" data-action="routes"><div><h3>📖 航路暗記帳</h3><p class="muted">公式情報の航路を会社や港から検索。</p></div><span class="chev">›</span></button><section class="panel soft"><div class="topline"><h3>学習の記録</h3><span class="badge">端末内に保存</span></div><div class="detailgrid"><div><strong>${saved.attempts.length}</strong><span>回答数</span></div><div><strong>${saved.wrong.length}</strong><span>要復習</span></div></div>${saved.wrong.length?'<button class="primary wide" style="margin-top:10px" data-action="review">間違えた問題を復習する</button>':''}</section><div class="notice">このアプリは各社の公開航路を使った一般向け教材。運賃・取引条件・社内資料は含まへんで。運航日の確認や実務判断には使わず、最新の公式情報を確認してな。</div><button class="ghost wide" data-action="sources">公式情報・このアプリについて ↗</button>`;}
function setup(){let pool=QUESTIONS.filter(q=>(state.quizCompany==='all'||q.company===state.quizCompany)&&(state.quizType==='all'||q.type===state.quizType));main.innerHTML=`<h2>クイズの設定</h2><div class="panel"><div class="controls"><label>船会社<select id="quiz-company">${option('all','すべての船会社',state.quizCompany)}${companyList.map(c=>option(c,c,state.quizCompany)).join('')}</select></label><label>問題の種類<select id="quiz-type">${[['all','全タイプ'],['route','航路を選ぶ'],['company','船会社を当てる'],['destination','行先を当てる'],['geography','港の位置']].map(([v,t])=>option(v,t,state.quizType)).join('')}</select></label><label>問題数<select id="quiz-count">${[['10','10問'],['20','20問'],['30','30問'],['all','対象すべて']].map(([v,t])=>option(v,t,state.quizCount)).join('')}</select></label></div><div class="pill">対象：${pool.length}問</div><button class="primary wide" style="margin-top:13px" data-action="start" ${!pool.length?'disabled':''}>スタート →</button></div><button class="ghost wide" data-action="home">ホームへ戻る</button>`;
 $('quiz-company').addEventListener('change',e=>{state.quizCompany=e.target.value;setup()});$('quiz-type').addEventListener('change',e=>{state.quizType=e.target.value;setup()});$('quiz-count').addEventListener('change',e=>{state.quizCount=e.target.value;setup()});}
function start(items){state.quizItems=shuffle(items).slice(0,state.quizCount==='all'?items.length:Number(state.quizCount));state.qIndex=0;state.selected=null;state.runCorrect=0;go('quiz')}
function quiz(){if(!state.quizItems.length){go('setup');return}if(state.qIndex>=state.quizItems.length)return results();const q=state.quizItems[state.qIndex],answered=state.selected!==null;
 main.innerHTML=`<div class="topline"><span class="badge">${esc(q.company)}</span><span class="muted">${state.qIndex+1} / ${state.quizItems.length} 問</span></div><div class="progress"><i style="width:${(state.qIndex+1)/state.quizItems.length*100}%"></i></div><h2>${esc(q.prompt)}</h2><div class="stack">${q.choices.map((choice,i)=>`<button type="button" class="answer ${answered?(choice===q.answer?'good':i===state.selected?'bad':'dim'):''}" data-answer="${i}" ${answered?'disabled':''}>${label(i)}. ${esc(choice)} ${answered&&choice===q.answer?'✓':''}</button>`).join('')}</div>${answered?`<div class="explain ${q.choices[state.selected]===q.answer?'':'bad'}"><h3>${q.choices[state.selected]===q.answer?'正解！':'惜しい！'}</h3><p>${esc(q.explain)}</p><div class="source">確認元：${srcLink(q.source)}</div></div><button class="primary wide" style="margin-top:12px" data-action="next">${state.qIndex===state.quizItems.length-1?'結果を見る':'次の問題へ →'}</button>`:''}<button class="ghost wide" style="margin-top:10px" data-action="setup">設定へ戻る</button>`;
 if(!answered)main.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.answer);if(state.selected!==null)return;state.selected=i;const good=q.choices[i]===q.answer;if(good)state.runCorrect++;saved.attempts.push({id:q.id,good,at:Date.now()});saved.attempts=saved.attempts.slice(-3000);saved.wrong=saved.wrong.filter(id=>id!==q.id);if(!good)saved.wrong.push(q.id);persist();render()}));}
function results(){const total=state.quizItems.length;main.innerHTML=`<div class="panel dark" style="text-align:center;padding:23px"><div style="font-size:43px">${state.runCorrect===total?'🏆':'🚢'}</div><h2 style="font-size:28px">${state.runCorrect} / ${total}問正解！</h2><p>正答率 ${Math.round(100*state.runCorrect/total)}%</p></div><div class="panel"><h3>次の一手</h3><p class="muted">間違えた問題は、この端末の復習リストに保存してるで。</p>${saved.wrong.length?'<button class="primary wide" data-action="review">苦手問題を復習</button>':''}<button class="secondary wide" style="margin-top:9px" data-action="setup">条件を変えて再挑戦</button><button class="ghost wide" style="margin-top:7px" data-action="home">ホームへ</button></div>`;}
function xy(lon,lat){return {x:(lon-129)/17*100,y:(46-lat)/16*100}}
function map(){const portNames=unique(ROUTES.filter(r=>state.mapCompany==='all'||r[0]===state.mapCompany).flatMap(r=>[r[1],r[2]])).filter(p=>PORTS[p]);if(!portNames.includes(state.selectedPort))state.selectedPort=portNames[0];const chosen=state.selectedPort;const connected=unique(ROUTES.filter(r=>(r[1]===chosen||r[2]===chosen)&&(state.mapCompany==='all'||r[0]===state.mapCompany)).flatMap(r=>[r[1],r[2]]));const related=ROUTES.filter(r=>(r[1]===chosen||r[2]===chosen)&&(state.mapCompany==='all'||r[0]===state.mapCompany));main.innerHTML=`<div class="topline"><h2>日本地図モード</h2><span class="badge">港をタップ</span></div><div class="controls"><label>船会社<select id="map-company">${option('all','すべての船会社',state.mapCompany)}${companyList.map(c=>option(c,c,state.mapCompany)).join('')}</select></label><label>港名から直接選ぶ<select id="map-port">${portNames.map(p=>option(p,p,chosen)).join('')}</select></label></div><div class="mapwrap" role="group" aria-label="日本地図。港の丸いボタンを押して選択してください"><svg aria-hidden="true" viewBox="0 0 560 740" preserveAspectRatio="xMidYMid meet"><path d="${JP_PATH}" fill="#c8d9c9" stroke="#88a99b" stroke-width="2" stroke-linejoin="round"/><text x="390" y="70" font-size="13" fill="#557487">北海道</text><text x="455" y="340" font-size="13" fill="#557487">太平洋</text><text x="44" y="240" font-size="13" fill="#557487">日本海</text></svg>${portNames.map(p=>{const {x,y}=xy(...PORTS[p]);return `<button type="button" class="map-pin ${p===chosen?'chosen':connected.includes(p)?'near':''}" aria-label="${esc(p)}を選ぶ" title="${esc(p)}" data-port="${esc(p)}" data-label="${esc(p)}" style="left:${x.toFixed(3)}%;top:${y.toFixed(3)}%">●</button>`}).join('')}</div><p class="pin-help tiny">港の位置は概略やで。色付きの点が選択中・関連港。航路線は陸地を横断せんように描いてへん。</p><div class="panel soft"><div class="topline"><div><div class="tiny">選択している港</div><h2 style="margin:0">📍 ${esc(chosen)}</h2></div><span class="badge">${related.length}区間</span></div><div class="listing">${related.slice(0,35).map(r=>`<div class="route"><span class="company-tag">${esc(r[0])}</span><strong>${esc(r[1])} → ${esc(r[2])}</strong></div>`).join('')||'<p class="muted">登録されている区間がないで。</p>'}</div><button class="primary wide" data-action="portquiz">この港のクイズに挑戦 →</button></div>`;
 $('map-company').addEventListener('change',e=>{state.mapCompany=e.target.value;map()});$('map-port').addEventListener('change',e=>{state.selectedPort=e.target.value;map()});main.querySelectorAll('[data-port]').forEach(b=>b.addEventListener('click',()=>{state.selectedPort=b.dataset.port;map()}));}
function routes(){const rows=ROUTES.filter(r=>(state.routeCompany==='all'||r[0]===state.routeCompany)&&`${r[0]}${r[1]}${r[2]}`.includes(state.search));main.innerHTML=`<h2>航路暗記帳</h2><div class="controls"><label>船会社<select id="route-company">${option('all','すべての船会社',state.routeCompany)}${companyList.map(c=>option(c,c,state.routeCompany)).join('')}</select></label><label>会社名・港名を検索<input id="route-search" placeholder="例：栗林、釧路、新門司" value="${esc(state.search)}" autocomplete="off" spellcheck="false"></label></div><div class="topline"><span class="pill">${rows.length}区間 / 全${ROUTES.length}区間</span><button class="ghost" data-action="clear">検索をリセット</button></div><div class="listing">${rows.map(r=>`<div class="route"><span class="company-tag">${esc(r[0])}</span><strong>${esc(r[1])} → ${esc(r[2])}</strong><span>${esc(r[4])}</span><div class="source">${srcLink(r[3])}</div></div>`).join('')||'<div class="panel">該当する航路が見つからへんかったで。</div>'}</div><button class="ghost wide" data-action="sources">資料・出典を見る ↗</button>`;
 $('route-company').addEventListener('change',e=>{state.routeCompany=e.target.value;routes()});$('route-search').addEventListener('input',e=>{state.search=e.target.value;const list=main.querySelector('.listing'),filtered=ROUTES.filter(r=>(state.routeCompany==='all'||r[0]===state.routeCompany)&&`${r[0]}${r[1]}${r[2]}`.includes(state.search));main.querySelector('.pill').textContent=`${filtered.length}区間 / 全${ROUTES.length}区間`;list.innerHTML=filtered.map(r=>`<div class="route"><span class="company-tag">${esc(r[0])}</span><strong>${esc(r[1])} → ${esc(r[2])}</strong><span>${esc(r[4])}</span><div class="source">${srcLink(r[3])}</div></div>`).join('')||'<div class="panel">該当する航路が見つからへんかったで。</div>';});}
function sources(){state.tab='home';updateTabs();main.innerHTML=`<h2>出典と利用上の注意</h2><div class="notice">2026年9月に公開されている運航会社・自治体の情報をもとに、一般的な発着地のみを独自に整理した教材やで。旧アプリに含まれた会社の料金・内部資料・車両条件などは一切収録してへん。</div><div class="panel"><h3>公式サイト・自治体の公開情報</h3><div class="src-list">${Object.entries(SOURCES).map(([k,s])=>`<div class="sourceitem"><strong>${esc(s.name)}</strong><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)} ↗</a></div>`).join('')}</div></div><div class="panel soft"><h3>地図について</h3><p class="muted">日本の輪郭：Natural Earth（Public Domain）の地理データを簡略化。港のボタン位置は概略で、寄港順や実際の航行経路を示すものではない。</p><a href="https://www.naturalearthdata.com/about/terms-of-use/" target="_blank" rel="noopener noreferrer">Natural Earth 利用条件 ↗</a></div><div class="panel soft"><h3>保存について</h3><p class="muted">学習履歴はブラウザの端末内保存（localStorage）。Safariの履歴・Webサイトデータを消すと消える場合がある。外部への学習履歴送信機能はないで。</p><button class="secondary wide" data-action="reset">学習履歴をリセット</button></div><button class="primary wide" data-action="home">ホームに戻る</button>`;}
document.addEventListener('click',e=>{const el=e.target.closest('button[data-tab],button[data-action]');if(!el)return;if(el.dataset.tab){go(el.dataset.tab);return}const a=el.dataset.action;if(a==='setup')go('setup');else if(['home','map','routes'].includes(a))go(a);else if(a==='start')start(QUESTIONS.filter(q=>(state.quizCompany==='all'||q.company===state.quizCompany)&&(state.quizType==='all'||q.type===state.quizType)));else if(a==='review'){const q=QUESTIONS.filter(q=>saved.wrong.includes(q.id));if(q.length)start(q);else go('setup')}else if(a==='portquiz'){let q=QUESTIONS.filter(q=>q.ports.includes(state.selectedPort));if(state.mapCompany!=='all')q=q.filter(x=>x.company===state.mapCompany);if(q.length)start(q)}else if(a==='next'){state.qIndex++;state.selected=null;render();window.scrollTo(0,0)}else if(a==='sources')sources();else if(a==='clear'){state.routeCompany='all';state.search='';routes()}else if(a==='reset'){if(confirm('学習履歴をすべて消す？')){saved={attempts:[],wrong:[]};persist();sources()}}});
render();
</script><footer>航路マスター公開情報版 · 個人学習用 · 運航状況は各社公式サイトを確認</footer></body></html>
