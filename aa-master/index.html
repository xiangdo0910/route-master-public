const STORAGE = 'aa-master-database-v1', STATSKEY='aa-master-progress-v1', FAVKEY='aa-master-favs-v1';

const $=(s,base=document)=>base.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function getSaved(key,other){try{let x=JSON.parse(localStorage.getItem(key));return x??other}catch{return other}}
let venues=getSaved(STORAGE,JSON.parse(JSON.stringify(INITIAL)));
if(!Array.isArray(venues)||!venues.length)venues=JSON.parse(JSON.stringify(INITIAL));
let progress=getSaved(STATSKEY,{});if(!progress||Array.isArray(progress)||typeof progress!=='object')progress={};
let favorites=getSaved(FAVKEY,[]);if(!Array.isArray(favorites))favorites=[];
let currentView='home', query='', regionFilter='すべて', brandFilter='すべて', listFilter='all';
let quizType='all',quizRegion='すべて',reviewOnly=false, currentQuestion=null, answered=false, chosen=null, recent=[], session={attempts:0,correct:0};
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(venues));localStorage.setItem(STATSKEY,JSON.stringify(progress));localStorage.setItem(FAVKEY,JSON.stringify(favorites));}catch{notice('保存できませんでした。ブラウザの容量を確認してな。')}}
function notice(t){let el=$('#toast');el.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.innerHTML='',3200)}
function entries(){return venues.flatMap(v=>['day','sale','one'].filter(t=>t==='day'?Number.isInteger(v.day)&&v.day>=0&&v.day<=6:!!v[t]&&v[t+'Status']==='verified').map(t=>({v,t,key:v.id+':'+t,answer:t==='day'?DAYS[v.day]:v[t]})))}
function getStat(){let arr=Object.values(progress);let a=arr.reduce((n,r)=>n+(r.ok||0)+(r.ng||0),0),c=arr.reduce((n,r)=>n+(r.ok||0),0);return {a,c,pct:a?Math.round(c/a*100):0,wrong:arr.filter(r=>(r.ng||0)>0&&(r.ok||0)<=(r.ng||0)*2).length}}
function isWeak(k){let p=progress[k];return !!p&&(p.ng||0)>0&&(p.ok||0)<=(p.ng||0)*2}
function statHTML(){let s=getStat();return `<section class="stats"><div class="stat"><div class="stat-value">${venues.length}</div><div class="stat-label">収録会場</div></div><div class="stat"><div class="stat-value">${s.a}</div><div class="stat-label">累計解答数</div></div><div class="stat"><div class="stat-value">${s.pct}<span style="font-size:15px">%</span></div><div class="stat-label">通算正答率</div></div><div class="stat"><div class="stat-value">${s.wrong}</div><div class="stat-label">復習が必要な問題</div></div></section>`}

function home(){let r=venues.filter(x=>['TAA','CAA','NAA','ベイオーク'].includes(x.brand)).slice(0,8);$('#view').innerHTML=`<div class="hero"><div><div class="hero-tag">AA STUDY SYSTEM</div><h1>開催曜日も、搬出期限も。<br>まとめて自分の武器に。</h1><p>全国のAA会場を、セリ落札とワンプラ落札に分けて覚える。確認済みルールだけで出題する、輸送手配のための学習ツール。</p><button class="btn btn-primary" data-nav="quiz">クイズを始める →</button></div><div class="hero-big">AA</div></div>${statHTML()}<div class="labelrow"><h2>学習メニュー</h2><span class="faint">知識を積み上げよう</span></div><div class="wide-grid"><div class="panel"><div style="font-size:24px;margin-bottom:8px">▣</div><h3>毎日ちょっとずつ暗記クイズ</h3><p>開催曜日・セリ落札・ワンプラを切り替えて出題。苦手問題だけの復習もできる。</p><div style="margin-top:18px"><button class="btn btn-primary btn-small" data-nav="quiz">問題を解く →</button></div></div><div class="panel"><div style="font-size:24px;margin-bottom:8px">▤</div><h3>会場ルールの早見表</h3><p>会場名・エリア・AAグループで絞り込み。出典と例外事項も一緒にチェックできる。</p><div style="margin-top:18px"><button class="btn btn-secondary btn-small" data-nav="venues">会場を調べる →</button></div></div></div><div class="labelrow"><h2>まず覚えたい会場</h2><span class="faint">タップすると詳細へ</span></div><div class="featured">${r.map(v=>`<button class="chip" data-detail="${esc(v.id)}">${esc(v.name)} ↗</button>`).join('')}</div><div class="callout"><strong>ワンプラの注意点</strong><br>「落札日を含む◯日」と「◯営業日」は別物。TAAのワンプラやNAAのNa@速決！のように、サービスごとの条件も覚えよう。時刻や条件に情報差がある項目は出題から外しているで。</div>`}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function pool(){return entries().filter(x=>(quizType==='all'||x.t===quizType)&&(quizRegion==='すべて'||quizRegion===x.v.region)&&(!reviewOnly||isWeak(x.key)))}
function nextQuestion(){let a=pool(),p=a.filter(x=>!recent.includes(x.key));if(!p.length)p=a;if(!p.length){currentQuestion=null;answered=false;return}currentQuestion=random(p);recent.push(currentQuestion.key);if(recent.length>8)recent.shift();answered=false;chosen=null}
function alternatives(q){let possible=[...new Set(entries().filter(x=>x.t===q.t).map(x=>x.answer))].filter(a=>a!==q.answer);let out=shuffle(possible).slice(0,3);if(q.t==='day'){out=shuffle(DAYS.filter(d=>d!==q.answer)).slice(0,3)}return shuffle([q.answer,...out])}
let qOptions=[];
function quiz(){if(!currentQuestion||!pool().some(x=>x.key===currentQuestion.key))nextQuestion();let options=quizType,regionList=['すべて',...new Set(venues.map(x=>x.region))];$('#view').innerHTML=`<h1 class="page-title">暗記クイズ</h1><p class="lead">1問ずつ解いて、開催日と搬出期限を定着させよう。</p><div class="quiz-layout"><div class="quiz-mode">${[['all','すべて'],['day','開催曜日'],['sale','セリ落札'],['one','ワンプラ']].map(([k,l])=>`<button data-quiztype="${k}" class="${options===k?'selected':''}">${l}</button>`).join('')}</div><div class="quiz-controls" style="margin-top:12px"><select class="select" id="quizRegion" aria-label="出題エリア">${regionList.map(r=>`<option value="${esc(r)}" ${r===quizRegion?'selected':''}>${esc(r==='すべて'?'全国すべて':r)}</option>`).join('')}</select><button class="btn btn-small ${reviewOnly?'btn-primary':'btn-secondary'}" id="reviewToggle">${reviewOnly?'✓ ':'↻ '}苦手だけ復習</button><span class="faint" style="align-self:center">出題可能 ${pool().length}問</span></div><div id="questionPlace"></div><div class="session-note">このセッション ${session.attempts}問中 ${session.correct}問正解 ・ 解答履歴は自動保存</div></div>`;drawQuestion()}
function drawQuestion(){let el=$('#questionPlace');if(!el)return;if(!currentQuestion){el.innerHTML=`<div class="empty"><h3>対象の問題がないで！</h3><p>苦手問題がまだないか、フィルターで絞りすぎているみたい。</p><button class="btn btn-primary" style="margin-top:14px" id="resetQuizFilter">全問題に戻す</button></div>`;return}let q=currentQuestion;if(!answered)qOptions=alternatives(q);let note=q.v.note||'会場の規約で必ず詳細確認を。';let isCorrect=chosen===q.answer;let title=q.t==='day'?'開催曜日':q.t==='sale'?'セリ落札の搬出期限':'ワンプラ落札の搬出期限';el.innerHTML=`<section class="question"><div class="q-top"><span class="q-type">QUESTION / ${esc(title)}</span><span>会場暗記</span></div><h2 class="q-title">${esc(q.v.name)}</h2><p class="q-sub">${esc(TYPES_Q[q.t])}</p><div class="answers">${qOptions.map((a,i)=>`<button class="answer ${answered?(a===q.answer?'correct':a===chosen?'incorrect':''):''}" data-answer="${esc(i)}" ${answered?'disabled':''}><span class="a-index">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span></button>`).join('')}</div>${answered?`<div class="result ${isCorrect?'good':'bad'}" role="status"><h3>${isCorrect?'正解！ よく覚えてるで。':'惜しい！ ここを覚えよう。'}</h3><p>正しい答え</p><div class="answer-text">${esc(q.answer)}</div><p style="margin-top:11px">${esc(note)}</p>${q.v.source?`<div style="margin-top:12px"><a href="${esc(safeUrl(q.v.source))}" target="_blank" rel="noopener noreferrer">参考規約を開く ↗</a></div>`:''}</div>`:''}<div class="quiz-actions"><button class="btn btn-quiet btn-small" data-detail="${esc(q.v.id)}">会場の詳細を見る ↗</button>${answered?'<button class="btn btn-primary" id="nextQuestion">次の問題へ →</button>':'<button class="btn btn-quiet" id="giveup">わからない / 答えを見る</button>'}</div></section>`}
function answer(i){if(answered||!currentQuestion)return;const a=i===null?null:qOptions[i];if(i!==null&&!a)return;chosen=a;answered=true;const p=progress[currentQuestion.key]||{ok:0,ng:0};const correct=a===currentQuestion.answer;p[correct?'ok':'ng']++;p.last=Date.now();progress[currentQuestion.key]=p;session.attempts++;if(correct)session.correct++;save();drawQuestion();let sn=$('.session-note');if(sn)sn.textContent=`このセッション ${session.attempts}問中 ${session.correct}問正解 ・ 解答履歴は自動保存`}

function listing(){let regions=['すべて',...new Set(venues.map(v=>v.region))],brands=['すべて',...new Set(venues.map(v=>v.brand))],a=venues.filter(v=>(!query||(v.name+' '+v.brand+' '+v.region).toLowerCase().includes(query.toLowerCase()))&&(regionFilter==='すべて'||v.region===regionFilter)&&(brandFilter==='すべて'||v.brand===brandFilter)&&(listFilter!=='fav'||favorites.includes(v.id)));$('#view').innerHTML=`<h1 class="page-title">会場一覧</h1><p class="lead">開催曜日・通常セリ・ワンプラを会場別に確認できるで。</p><div class="toolbar"><input class="search" id="venueSearch" placeholder="会場名で検索（例：TAA、神戸、NAA）" value="${esc(query)}" aria-label="会場検索"><select class="select" id="regionFilter" aria-label="エリア">${regions.map(v=>`<option value="${esc(v)}" ${v===regionFilter?'selected':''}>${esc(v==='すべて'?'全エリア':v)}</option>`).join('')}</select><select class="select" id="brandFilter" aria-label="AAグループ">${brands.map(v=>`<option value="${esc(v)}" ${v===brandFilter?'selected':''}>${esc(v==='すべて'?'全グループ':v)}</option>`).join('')}</select><button class="btn btn-small ${listFilter==='fav'?'btn-primary':'btn-secondary'}" id="filterFav">★ お気に入り</button><button class="btn btn-primary btn-small" id="addVenue">＋ 会場追加</button></div><div class="labelrow"><h2>検索結果 ${a.length}件</h2><span class="faint">会場規約に変更があれば編集可能</span></div><div class="card-list" id="venueResults">${a.length?a.map(venueCard).join(''):`<div class="empty">一致する会場がないで。検索条件を変えてみてな。</div>`}</div>`}

function edit(id){let v=id?venues.find(x=>x.id===id):null;$('#modal').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal-head"><h2 id="editTitle">${v?'会場ルールを編集':'会場を新規追加'}</h2><button class="close" data-close aria-label="閉じる">×</button></div><form id="venueForm" data-id="${esc(id||'')}"><div class="formgrid"><label class="form-item"><span class="formlabel">会場名 *</span><input name="name" value="${esc(v?.name||'')}" required maxlength="80"></label><label class="form-item"><span class="formlabel">グループ名</span><input name="brand" value="${esc(v?.brand||'')}" placeholder="例：USS" maxlength="40"></label><label class="form-item"><span class="formlabel">エリア</span><select name="region">${['近畿','関東','中部','中国・四国','九州','東北・北海道','その他'].map(r=>`<option ${r===(v?.region||'近畿')?'selected':''}>${r}</option>`).join('')}</select></label><label class="form-item"><span class="formlabel">開催曜日</span><select name="day">${DAYS.map((r,i)=>`<option value="${i}" ${i===(v?.day??0)?'selected':''}>${r}</option>`).join('')}</select></label><label class="form-item full"><span class="formlabel">セリ落札の搬出期限</span><input name="sale" value="${esc(v?.sale||'')}" placeholder="例：開催翌週 木曜日 12:00"></label><label class="form-item full"><span class="formlabel">ワンプラ落札の搬出期限</span><input name="one" value="${esc(v?.one||'')}" placeholder="例：落札日を含む4営業日"></label><label class="form-item full"><span class="formlabel">特記事項（映像・休日・サテライト・例外など）</span><textarea name="note" placeholder="覚えると便利なポイント">${esc(v?.note||'')}</textarea></label><label class="form-item full"><span class="formlabel">参考規約URL</span><input type="url" name="source" value="${esc(v?.source||'')}" placeholder="https://..."></label><label class="form-item full"><span class="formlabel"><input name="useQuiz" type="checkbox" ${v?.oneStatus==='check'?'':'checked'} style="width:auto;min-height:auto;margin-right:7px">入力した期限をクイズに使う</span><span class="faint">ルールを確認してからオンにしてな。OFFなら期限を表示するだけ。</span></label></div><div class="form-footer">${v&&v.custom?`<button type="button" class="btn" data-remove="${esc(v.id)}">削除</button>`:''}<button type="button" class="btn btn-secondary" data-close>キャンセル</button><button type="submit" class="btn btn-primary">保存する</button></div></form></section></div>`}
function closeModal(){let m=$('#modal');m.innerHTML=''}
function settings(){let quizCount=entries().length;$('#view').innerHTML=`<h1 class="page-title">設定・データ管理</h1><p class="lead">会場ルールも学習記録も、このブラウザ内に保存されるで。</p><div class="setting-section"><h2>収録データ</h2><p>${venues.length}会場、合計${quizCount}問のクイズが利用可能。登録情報は自動更新されません。</p><button class="btn btn-primary btn-small" id="addVenue">＋ 会場を追加する</button> <button class="btn btn-secondary btn-small" data-nav="venues">登録データを見る</button></div><div class="setting-section"><h2>データのバックアップ</h2><p>ブラウザを消去したり、別の端末に乗り換えたりすると学習記録が消える可能性があるで。バックアップをJSONで保存しておこう。</p><div class="toolbar"><button class="btn btn-primary btn-small" id="exportData">↓ バックアップ保存</button><label class="btn btn-secondary btn-small" for="importData">↑ バックアップ読み込み</label><input type="file" id="importData" accept=".json,application/json" hidden></div></div><div class="setting-section"><h2>学習記録をリセット</h2><p>会場の登録情報は残して、解答成績だけを最初からやり直せる。</p><button class="btn btn-secondary btn-small" id="clearProgress">解答履歴だけ削除</button></div><div class="setting-section"><h2>会場情報を初期状態に戻す</h2><p>自分で追加・変更した会場ルールがすべて初期状態に戻るで。学習記録はそのまま残る。</p><button class="btn btn-secondary btn-small" id="resetVenues">会場データを復元</button></div><div class="callout"><strong>期限の取り扱い</strong><br>収録内容は各会場の公開規約・TC-webΣの搬出期限表などを基にした学習用要約。日祝・事務局休業・例外コーナーなどは自動計算していないので、出庫判断に直接使わないでな。</div>`}
function download(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function getCheckbox(form,name){return !!form.elements[name]?.checked}
function submitVenue(form){let fd=new FormData(form),id=form.dataset.id,name=String(fd.get('name')||'').trim();if(!name){notice('会場名を入れてな');return}let old=venues.find(x=>x.id===id);let data={id:old?.id||'custom'+Date.now(),name,region:String(fd.get('region')||'その他'),brand:String(fd.get('brand')||'その他').trim()||'その他',day:Number(fd.get('day')),sale:String(fd.get('sale')||'').trim(),one:String(fd.get('one')||'').trim(),note:String(fd.get('note')||'').trim(),source:safeUrl(fd.get('source')||''),source2:old?.source2||'',custom:true};let useQuiz=getCheckbox(form,'useQuiz');data.saleStatus=data.sale?(useQuiz?'verified':'check'):'unknown';data.oneStatus=data.one?(useQuiz?'verified':'check'):'unknown';if(old)Object.assign(old,data);else venues.push(data);save();closeModal();notice('会場情報を保存したで');currentQuestion=null;render()}
function validatedVenue(v){return v&&typeof v.id==='string'&&typeof v.name==='string'&&typeof v.region==='string'&&typeof v.brand==='string'&&Number.isInteger(v.day)&&v.day>=0&&v.day<7&&['sale','one'].every(k=>!v[k]||typeof v[k]==='string')}
document.addEventListener('click',e=>{let b=e.target.closest('button, [data-close]');if(!b)return;if(b.dataset.nav){nav(b.dataset.nav);return}if(b.dataset.detail){detail(b.dataset.detail);return}if(b.dataset.close!==undefined){closeModal();return}if(b.id==='backdrop'&&e.target===b){closeModal();return}if(b.dataset.edit){edit(b.dataset.edit);return}if(b.dataset.fav){let id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();listing();return}if(b.dataset.quiztype){quizType=b.dataset.quiztype;currentQuestion=null;quiz();return}if(b.dataset.answer!==undefined){answer(Number(b.dataset.answer));return}if(b.id==='nextQuestion'){nextQuestion();quiz();return}if(b.id==='giveup'){answer(null);return}if(b.id==='reviewToggle'){reviewOnly=!reviewOnly;currentQuestion=null;quiz();return}if(b.id==='resetQuizFilter'){quizType='all';reviewOnly=false;quizRegion='すべて';currentQuestion=null;quiz();return}if(b.id==='filterFav'){listFilter=listFilter==='fav'?'all':'fav';listing();return}if(b.id==='addVenue'){edit(null);return}if(b.id==='exportData'){download('aa-master-backup.json',{app:'AAマスター',version:1,exportedAt:new Date().toISOString(),venues,progress,favorites});notice('バックアップを保存したで');return}if(b.id==='clearProgress'){if(confirm('解答履歴をすべて消去する？')){progress={};session={attempts:0,correct:0};save();render();notice('解答履歴を消去したで')}return}if(b.id==='resetVenues'){if(confirm('会場情報を初期状態に戻す？ 自分で編集した内容は失われます。')){venues=JSON.parse(JSON.stringify(INITIAL));save();render();notice('初期データに戻したで')}return}if(b.dataset.remove){if(confirm('この会場を削除する？')){venues=venues.filter(x=>x.id!==b.dataset.remove);save();closeModal();render();notice('削除したで')}return}});
document.addEventListener('submit',e=>{if(e.target.id==='venueForm'){e.preventDefault();submitVenue(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='venueSearch'){query=e.target.value;let a=venues.filter(v=>(!query||(v.name+' '+v.brand+' '+v.region).toLowerCase().includes(query.toLowerCase()))&&(regionFilter==='すべて'||v.region===regionFilter)&&(brandFilter==='すべて'||v.brand===brandFilter)&&(listFilter!=='fav'||favorites.includes(v.id)));$('#venueResults').innerHTML=a.length?a.map(venueCard).join(''):`<div class="empty">一致する会場がないで。</div>`;$('.labelrow h2').textContent='検索結果 '+a.length+'件'}});
document.addEventListener('change',async e=>{let x=e.target;if(x.id==='quizRegion'){quizRegion=x.value;currentQuestion=null;quiz();return}if(x.id==='regionFilter'){regionFilter=x.value;listing();return}if(x.id==='brandFilter'){brandFilter=x.value;listing();return}if(x.id==='importData'){let file=x.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.venues)||!data.venues.length||data.venues.length>600||!data.venues.every(validatedVenue))throw Error('形式');if(!confirm(`${data.venues.length}会場分のバックアップを読み込む？ 現在のデータと成績は上書きされるで。`))return;venues=data.venues.map(v=>({...v,source:safeUrl(v.source||''),source2:safeUrl(v.source2||'')}));progress={};if(data.progress&&typeof data.progress==='object'&&!Array.isArray(data.progress)){for(const [k,v] of Object.entries(data.progress)){if(typeof k==='string'&&k.length<100&&v&&typeof v==='object'){progress[k]={ok:Math.max(0,Math.min(100000,Number(v.ok)||0)),ng:Math.max(0,Math.min(100000,Number(v.ng)||0))}}}}favorites=Array.isArray(data.favorites)?data.favorites:[];save();currentQuestion=null;nav('home');notice('バックアップを復元したで')}catch{notice('読み込めないJSONファイルやで。形式を確認してな')}finally{x.value=''}return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal();if(currentView==='quiz'&&!$('#modal').innerHTML){if(!answered&&['1','2','3','4'].includes(e.key))answer(Number(e.key)-1);else if(answered&&e.key==='Enter'){nextQuestion();quiz()}}});
document.addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});
nav('home');
</script>
</body></html>
